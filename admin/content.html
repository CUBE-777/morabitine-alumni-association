<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محتوى الموقع — لوحة إدارة الجمعية</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-layout.js"></script>
<script>
const FIELDS = [
  { section: 'homepage', key: 'hero_title', label: 'عنوان الصفحة الرئيسية (Hero)' },
  { section: 'homepage', key: 'about_title', label: 'عنوان قسم من نحن' },
  { section: 'footer', key: 'copyright', label: 'نص حقوق النشر بالفوتر' }
];

(async function init() {
  const profile = await Auth.requireAuth(['super_admin', 'editor']);
  if (!profile) return;
  const main = AdminLayout.render(profile, 'content');
  main.innerHTML = `
    <div class="page-header">
      <div><h1>محتوى الموقع</h1><div class="page-subtitle">عدّل النصوص الظاهرة في الصفحة الرئيسية والفوتر دون لمس الكود</div></div>
    </div>
    <div class="panel">
      <form id="contentForm">${FIELDS.map(f => `
        <div class="form-group">
          <label>${f.label}</label>
          <textarea id="fld_${f.section}_${f.key}" data-section="${f.section}" data-key="${f.key}">جاري التحميل...</textarea>
        </div>`).join('')}
        <button type="submit" class="btn btn-primary">حفظ كل التعديلات</button>
      </form>
    </div>
  `;
  document.getElementById('contentForm').addEventListener('submit', (e) => { e.preventDefault(); saveAll(); });
  load();
})();

async function load() {
  try {
    const { data, error } = await sb.from('site_content').select('*');
    if (error) throw error;
    FIELDS.forEach(f => {
      const row = data.find(d => d.section === f.section && d.key === f.key);
      document.getElementById(`fld_${f.section}_${f.key}`).value = row?.value || '';
    });
  } catch (err) {
    notify.fromError(err, 'تعذر تحميل المحتوى');
  }
}

async function saveAll() {
  const t = notify.loading('جاري الحفظ...');
  try {
    const rows = FIELDS.map(f => ({
      section: f.section,
      key: f.key,
      value: document.getElementById(`fld_${f.section}_${f.key}`).value
    }));
    const { error } = await sb.from('site_content').upsert(rows, { onConflict: 'section,key' });
    if (error) throw error;
    await Auth.log('ADMIN_UPDATED_CONTENT', 'site_content', null, 'تحديث محتوى الموقع');
    t.remove(); notify.success('تم حفظ المحتوى بنجاح');
  } catch (err) {
    t.remove(); notify.fromError(err, 'تعذر حفظ المحتوى');
  }
}
</script>
</body>
</html>
