<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة موقع الجمعية</title>
  <link rel="icon" href="../logo.jpg" type="image/jpeg" />
</head>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var h = window.h;

    function personToJS(item) {
      if (!item) return {};
      return typeof item.toJS === 'function' ? item.toJS() : item;
    }

    function listToArray(list) {
      if (!list) return [];
      if (typeof list.toArray === 'function') {
        return list.toArray().map(personToJS);
      }
      return Array.isArray(list) ? list : [];
    }

    function MemberCard(person, fallbackBadge, getAsset) {
      var name = person.name || 'عضو الجمعية';
      var badge = person.role || fallbackBadge;
      var image = '/logo.jpg';
      if (person.image && getAsset) {
        var asset = getAsset(person.image);
        image = asset && asset.toString ? asset.toString() : person.image;
      } else if (person.image) {
        image = person.image;
      }
      var rows = [
        ['العمر', person.age],
        ['سنة التخرج', person.promo],
        ['شعبة الباكالوريا', person.track],
        ['المهنة / التخصص', person.profession],
      ].filter(function (row) {
        return row[1] != null && String(row[1]).trim() !== '';
      });

      return h('article', {className: 'preview-card'},
        h('img', {className: 'preview-photo', src: image, alt: name}),
        h('div', {className: 'preview-body'},
          h('div', {className: 'preview-name-row'},
            h('h3', {}, name),
            h('span', {className: 'preview-badge'}, badge)
          ),
          rows.length ? h('ul', {className: 'preview-facts'}, rows.map(function (row) {
            return h('li', {key: row[0]},
              h('span', {}, row[0]),
              h('strong', {}, String(row[1]))
            );
          })) : null
        )
      );
    }

    var MembersPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        var board = listToArray(entry.getIn(['data', 'board']));
        var members = listToArray(entry.getIn(['data', 'members']));

        return h('div', {className: 'preview-wrap', dir: 'rtl'},
          h('p', {className: 'preview-note'}, 'هكذا ستظهر البطاقات للزائر بعد النشر.'),
          h('h2', {}, 'المكتب المسير الحالي'),
          h('div', {className: 'preview-grid'},
            board.length
              ? board.map(function (person, i) {
                return h('div', {key: 'b' + i}, MemberCard(person, 'المكتب المسير', getAsset));
              })
              : h('p', {className: 'preview-empty'}, 'لم يُضف أحد بعد إلى المكتب المسير.')
          ),
          h('h2', {}, 'الأعضاء'),
          h('div', {className: 'preview-grid'},
            members.length
              ? members.map(function (person, i) {
                return h('div', {key: 'm' + i}, MemberCard(person, 'عضو', getAsset));
              })
              : h('p', {className: 'preview-empty'}, 'لم يُضف أعضاء بعد.')
          )
        );
      }
    });

    CMS.registerPreviewTemplate('members_file', MembersPreview);
    CMS.registerPreviewStyle('/admin/preview.css');
  </script>
</body>

</html>
