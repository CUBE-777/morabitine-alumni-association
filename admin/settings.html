<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — لوحة إدارة الجمعية</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-layout.js"></script>
<script>
const GROUPS = [
  { title: 'عام', keys: [
    ['association_name', 'اسم الجمعية'],
    ['email', 'البريد الإلكتروني'],
    ['phone', 'الهاتف'],
    ['address', 'العنوان']
  ]},
  { title: 'التواصل الاجتماعي', keys: [
    ['whatsapp', 'واتساب (بدون +)'],
    ['facebook', 'رابط فيسبوك'],
    ['instagram', 'رابط إنستغرام'],
    ['youtube', 'رابط يوتيوب']
  ]},
  { title: 'الخريطة', keys: [
    ['google_maps_url', 'رابط خرائط Google']
  ]}
];

(async function init() {
  const profile = await Auth.requireAuth(['super_admin']);
  if (!profile) return;
  const main = AdminLayout.render(profile, 'settings');
  main.innerHTML = `
    <div class="page-header"><div><h1>الإعدادات العامة</h1><div class="page-subtitle">معلومات الجمعية الأساسية الظاهرة في الموقع</div></div></div>
    <form id="settingsForm">
      ${GROUPS.map(g => `
        <div class="panel">
          <h2>${g.title}</h2>
          ${g.keys.map(([k, label]) => `
            <div class="form-group">
              <label>${label}</label>
              <input id="s_${k}" data-key="${k}" value="">
            </div>`).join('')}
        </div>`).join('')}
      <button type="submit" class="btn btn-primary">حفظ الإعدادات</button>
    </form>
  `;
  document.getElementById('settingsForm').addEventListener('submit', (e) => { e.preventDefault(); saveAll(); });
  load();
})();

async function load() {
  try {
    const { data, error } = await sb.from('site_settings').select('*');
    if (error) throw error;
    data.forEach(row => {
      const input = document.getElementById(`s_${row.key}`);
      if (input) input.value = row.value || '';
    });
  } catch (err) {
    notify.fromError(err, 'تعذر تحميل الإعدادات');
  }
}

async function saveAll() {
  const t = notify.loading('جاري الحفظ...');
  try {
    const rows = [];
    GROUPS.forEach(g => g.keys.forEach(([k]) => {
      rows.push({ key: k, value: document.getElementById(`s_${k}`).value.trim() });
    }));
    const { error } = await sb.from('site_settings').upsert(rows, { onConflict: 'key' });
    if (error) throw error;
    await Auth.log('ADMIN_UPDATED_SETTINGS', 'site_settings', null, 'تحديث الإعدادات العامة');
    t.remove(); notify.success('تم حفظ الإعدادات بنجاح');
  } catch (err) {
    t.remove(); notify.fromError(err, 'تعذر حفظ الإعدادات');
  }
}
</script>
</body>
</html>
