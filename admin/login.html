<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — لوحة إدارة الجمعية</title>
  <link rel="icon" href="../logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #173a7d 0%, #0f2657 45%, #081633 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box { background: #fff; border-radius: 18px; padding: 36px 32px; max-width: 380px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
    .login-box img { width: 56px; height: 56px; border-radius: 12px; display: block; margin: 0 auto 14px; }
    .login-box h1 { font-family: 'Amiri', serif; text-align: center; color: #081633; font-size: 1.3rem; margin-bottom: 6px; }
    .login-box p.sub { text-align: center; color: #5b6784; font-size: .85rem; margin-bottom: 26px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 6px; color: #081633; }
    input {
      width: 100%; padding: 11px 14px; border: 1px solid #e9e3d5; border-radius: 8px; font-size: .92rem; font-family: inherit;
    }
    input:focus { outline: 2px solid #f2a93b; border-color: transparent; }
    button {
      width: 100%; padding: 12px; background: #f2a93b; color: #081633; font-weight: 700;
      border: none; border-radius: 8px; font-size: .95rem; cursor: pointer; margin-top: 6px;
      font-family: inherit;
    }
    button:hover { background: #ffd98a; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg { background: #fbe7e6; color: #b3261e; padding: 10px 12px; border-radius: 8px; font-size: .85rem; margin-bottom: 16px; display: none; }
    .back-link { display: block; text-align: center; margin-top: 18px; font-size: .82rem; color: #5b6784; text-decoration: none; }
  </style>
</head>
<body>
  <form class="login-box" id="loginForm" novalidate>
    <img src="../logo.jpg" alt="شعار الجمعية">
    <h1>لوحة إدارة الجمعية</h1>
    <p class="sub">جمعية خريجي ثانوية المرابطين ببيوكرة</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" required autocomplete="username" placeholder="admin@example.com">
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" id="submitBtn">تسجيل الدخول</button>
    <a href="../index.html" class="back-link">← العودة إلى الموقع الرئيسي</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // إن كانت هناك جلسة نشطة بالفعل، انتقل مباشرة إلى لوحة التحكم
    (async () => {
      const session = await Auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    const params = new URLSearchParams(window.location.search);
    if (params.get('reason') === 'inactive') {
      const box = document.getElementById('errorMsg');
      box.textContent = 'تم تعطيل حسابك، تواصل مع المسؤول الأعلى.';
      box.style.display = 'block';
    }

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الدخول...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await Auth.login(email, password);
        const profile = await Auth.getProfile();
        if (!profile || !profile.is_active) {
          await sb.auth.signOut();
          throw new Error('لا تملك صلاحية الوصول إلى لوحة الإدارة، أو أن حسابك غير نشط.');
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        const msg = /Invalid login credentials/i.test(err.message || '')
          ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.'
          : (err.message || 'تعذر تسجيل الدخول، حاول مرة أخرى.');
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
