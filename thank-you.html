<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شكراً لتواصلكم — جمعية خريجي ثانوية المرابطين</title>
<link rel="icon" href="logo.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --navy-deep:#081633; --navy-mid:#173a7d; --gold:#f2a93b; --gold-light:#ffd98a; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background:linear-gradient(135deg, var(--navy-mid), var(--navy-deep));
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .box{ max-width:480px; color:#fff; }
  .icon{
    width:80px; height:80px; border-radius:50%;
    background:rgba(242,169,59,.15); border:1px solid rgba(242,169,59,.4);
    display:flex; align-items:center; justify-content:center;
    font-size:2.2rem; margin:0 auto 24px;
  }
  h1{ font-family:'Amiri', serif; font-size:1.8rem; margin-bottom:14px; }
  p{ color:#c9d3ea; margin-bottom:28px; line-height:1.7; }
  a{
    display:inline-block; background:var(--gold); color:var(--navy-deep);
    padding:12px 28px; border-radius:8px; font-weight:700; text-decoration:none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>شكراً لتواصلكم معنا</h1>
    <p>تم استلام رسالتكم بنجاح، وسنقوم بالرد عليكم عبر بريدكم الإلكتروني في أقرب وقت ممكن.</p>
    <a href="/">العودة للموقع الرئيسي</a>
  </div>
</body>
</html>
